name: Deploy Railway + Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Railway backend
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SVC_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend URL secret
        shell: bash
        run: |
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "::error title=Missing RAILWAY_BACKEND_URL::Add RAILWAY_BACKEND_URL to GitHub repo Settings → Secrets → Actions."
            exit 1
          fi

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        run: npm install -g @railway/cli@4.5.4

      - name: Deploy via Railway CLI
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        run: |
          echo "Deploying service ${SVC_ID}..."
          railway up --service="$SVC_ID"

      - name: Note — Railway CLI secrets not configured
        if: env.RAILWAY_TOKEN == '' || env.SVC_ID == ''
        shell: bash
        run: |
          echo "::warning title=Railway CLI deploy skipped::RAILWAY_TOKEN and/or RAILWAY_SERVICE_ID not set. Waiting for Railway GitHub auto-deploy instead."
          echo "Add secrets per docs/GITHUB_DEPLOY_SECRETS.md to enable CLI deploy from Actions."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for backend ready
        run: pip install httpx && python scripts/deploy/wait_for_backend.py --url "$BACKEND_URL" --timeout 600

      - name: Run staging E2E seed
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        run: railway run --service="$SVC_ID" python scripts/deploy/staging_e2e_seed.py

  deploy-frontend:
    name: Vercel frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    defaults:
      run:
        working-directory: frontend-sante/frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VITE_API_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing ${name}::Add ${name} to GitHub repo Settings → Secrets → Actions."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@41.4.4

      - name: Deploy to Vercel production
        env:
          VITE_TELECONSULT_PROVIDER: jitsi
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Smoke test production
        env:
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.VERCEL_FRONTEND_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FRONTEND_URL:-}" ]; then
            echo "::error title=Missing VERCEL_FRONTEND_URL::Add VERCEL_FRONTEND_URL to GitHub Actions secrets."
            exit 1
          fi
          python scripts/deploy/post_deploy_verify.py \
            --backend "$BACKEND_URL" \
            --frontend "$FRONTEND_URL"
