name: Deploy Railway + Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Railway backend
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SVC_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - name: Validate Railway secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error title=Missing RAILWAY_TOKEN::Create a Railway PROJECT token (not account API token): Railway dashboard → your project → Settings → Tokens → Create token. Add it to GitHub repo Settings → Secrets → Actions as RAILWAY_TOKEN."
            exit 1
          fi
          if [ -z "${SVC_ID:-}" ]; then
            echo "::error title=Missing RAILWAY_SERVICE_ID::Copy the backend service UUID from Railway → backend service → Settings (or from the service URL). Add it to GitHub repo Settings → Secrets → Actions as RAILWAY_SERVICE_ID."
            exit 1
          fi
          echo "Railway CLI version: $(railway --version)"
          echo "Deploy target service: ${SVC_ID}"

      - uses: actions/checkout@v4

      - name: Deploy backend to Railway
        shell: bash
        run: railway up --service="$SVC_ID"

      - name: Run staging E2E seed
        shell: bash
        run: railway run --service="$SVC_ID" python scripts/deploy/staging_e2e_seed.py

  deploy-frontend:
    name: Vercel frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    defaults:
      run:
        working-directory: frontend-sante/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID VITE_API_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing ${name}::Add ${name} to GitHub repo Settings → Secrets → Actions."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@41.4.4

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TELECONSULT_PROVIDER: jitsi
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Smoke test production
        env:
          BACKEND_URL: ${{ secrets.RAILWAY_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.VERCEL_FRONTEND_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL:-}" ] || [ -z "${FRONTEND_URL:-}" ]; then
            echo "::error title=Missing smoke-test URLs::Set RAILWAY_BACKEND_URL and VERCEL_FRONTEND_URL in GitHub Actions secrets."
            exit 1
          fi
          python scripts/deploy/post_deploy_verify.py \
            --backend "$BACKEND_URL" \
            --frontend "$FRONTEND_URL"
