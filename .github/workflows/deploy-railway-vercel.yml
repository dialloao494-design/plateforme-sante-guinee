name: Deploy Railway + Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**"

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Railway backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.5.4

      - name: Deploy backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway link "${{ secrets.RAILWAY_PROJECT_ID }}" --environment production || true
          railway up --detach --service "${{ secrets.RAILWAY_SERVICE_ID }}"

      - name: Run staging E2E seed
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run --service "${{ secrets.RAILWAY_SERVICE_ID }}" python scripts/deploy/staging_e2e_seed.py

  deploy-frontend:
    name: Vercel frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    defaults:
      run:
        working-directory: frontend-sante/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install -g vercel@41.4.4

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TELECONSULT_PROVIDER: jitsi
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Smoke test backend
        run: |
          python scripts/deploy/post_deploy_verify.py \
            --backend "${{ secrets.RAILWAY_BACKEND_URL }}" \
            --frontend "${{ secrets.VERCEL_FRONTEND_URL }}"
