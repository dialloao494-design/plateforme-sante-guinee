name: Deploy Railway + Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-railway-vercel
  cancel-in-progress: false

env:
  DEFAULT_BACKEND_URL: https://web-production-ad6a36.up.railway.app
  # Canonical production frontend (GitHub-connected Vercel project).
  # Do NOT use frontend-seven-rust-94.vercel.app — that project is retired.
  DEFAULT_FRONTEND_URL: https://plateforme-sante-guinee.vercel.app

jobs:
  deploy-backend:
    name: Railway backend
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      SVC_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve backend URL
        shell: bash
        run: |
          url="${{ secrets.RAILWAY_BACKEND_URL }}"
          if [ -z "${url:-}" ]; then
            url="${DEFAULT_BACKEND_URL}"
            echo "::warning title=Using default backend URL::Set RAILWAY_BACKEND_URL in GitHub Actions secrets to override."
          fi
          echo "BACKEND_URL=${url}" >> "$GITHUB_ENV"

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        run: npm install -g @railway/cli@4.5.4

      - name: Enforce canonical FRONTEND_URL on Railway
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          canonical="${{ secrets.VERCEL_FRONTEND_URL }}"
          if [ -z "${canonical:-}" ]; then
            canonical="${DEFAULT_FRONTEND_URL}"
          fi
          echo "Setting Railway FRONTEND_URL=${canonical} on service ${SVC_ID}"
          railway variables --service="$SVC_ID" --set "FRONTEND_URL=${canonical}"
          # Clear alternate keys that could still inject the legacy host

      - name: Deploy via Railway CLI
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        run: |
          echo "Deploying service ${SVC_ID}..."
          railway up --service="$SVC_ID"

      - name: Note — Railway CLI secrets not configured
        if: env.RAILWAY_TOKEN == '' || env.SVC_ID == ''
        shell: bash
        run: |
          echo "::error title=Railway CLI deploy blocked::RAILWAY_TOKEN and/or RAILWAY_SERVICE_ID not set. Cannot force Railway deploy or read Railway logs from Actions."
          echo "Waiting for Railway GitHub auto-deploy only (may be disconnected)."
          echo "Exact recovery steps: docs/RAILWAY_502_MANUAL_RECOVERY.md"
          echo "Required secrets: RAILWAY_TOKEN (project token) + RAILWAY_SERVICE_ID (service UUID)."
          echo "Project hint: sunny-illumination / public URL web-production-ad6a36.up.railway.app"
          echo "Until secrets exist, runtime remaps legacy seven-rust FRONTEND_URL to ${DEFAULT_FRONTEND_URL}."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for backend ready
        run: pip install httpx && python scripts/deploy/wait_for_backend.py --url "$BACKEND_URL" --timeout 600

      - name: Run staging E2E seed
        if: env.RAILWAY_TOKEN != '' && env.SVC_ID != ''
        run: railway run --service="$SVC_ID" python scripts/deploy/staging_e2e_seed.py

  deploy-frontend:
    name: Vercel frontend
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    defaults:
      run:
        working-directory: frontend-sante/frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve frontend URL and API URL
        shell: bash
        run: |
          frontend="${{ secrets.VERCEL_FRONTEND_URL }}"
          api="${{ secrets.VITE_API_URL }}"
          if [ -z "${frontend:-}" ]; then
            frontend="${DEFAULT_FRONTEND_URL}"
            echo "::warning title=Using default frontend URL::Set VERCEL_FRONTEND_URL in GitHub Actions secrets to override."
          fi
          if [ -z "${api:-}" ]; then
            api="${{ secrets.RAILWAY_BACKEND_URL }}"
          fi
          if [ -z "${api:-}" ]; then
            api="${DEFAULT_BACKEND_URL}"
          fi
          echo "FRONTEND_URL=${frontend}" >> "$GITHUB_ENV"
          echo "RESOLVED_VITE_API_URL=${api}" >> "$GITHUB_ENV"

      - name: Deploy to Vercel production
        if: env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != ''
        env:
          VITE_TELECONSULT_PROVIDER: jitsi
        run: |
          npm install -g vercel@41.4.4
          export VITE_API_URL="${RESOLVED_VITE_API_URL}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Note — Vercel CLI secrets not configured
        if: env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == ''
        shell: bash
        run: |
          echo "::warning title=Vercel CLI deploy skipped::VERCEL_TOKEN, VERCEL_ORG_ID, and/or VERCEL_PROJECT_ID not set. Waiting for Vercel GitHub auto-deploy instead."
          echo "Add secrets per docs/GITHUB_DEPLOY_SECRETS.md to enable CLI deploy from Actions."

      - uses: actions/setup-python@v5
        if: always()
        with:
          python-version: "3.12"

      - name: Wait for frontend ready
        if: always()
        working-directory: .
        run: pip install httpx && python scripts/deploy/wait_for_frontend.py --url "$FRONTEND_URL" --timeout 600

  verify:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve smoke-test URLs
        shell: bash
        run: |
          backend="${{ secrets.RAILWAY_BACKEND_URL }}"
          frontend="${{ secrets.VERCEL_FRONTEND_URL }}"
          if [ -z "${backend:-}" ]; then backend="${DEFAULT_BACKEND_URL}"; fi
          if [ -z "${frontend:-}" ]; then frontend="${DEFAULT_FRONTEND_URL}"; fi
          echo "BACKEND_URL=${backend}" >> "$GITHUB_ENV"
          echo "FRONTEND_URL=${frontend}" >> "$GITHUB_ENV"
      - run: pip install httpx
      - name: Smoke test production
        run: |
          for attempt in 1 2 3; do
            if python scripts/deploy/post_deploy_verify.py \
              --backend "$BACKEND_URL" \
              --frontend "$FRONTEND_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Smoke attempt ${attempt} failed; retrying in 15 seconds..."
              sleep 15
            fi
          done
          exit 1
