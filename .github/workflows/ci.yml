name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-sante/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://example.com/api
          VITE_TELECONSULT_PROVIDER: stub

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json
      - run: npm ci
        working-directory: frontend-sante/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend-sante/frontend
      - run: npm run test:e2e
        working-directory: frontend-sante/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend-sante/frontend/playwright-report/
          retention-days: 7

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed secrets
        run: |
          set -e
          if git ls-files | grep -E '^\.env$|^deploy/env/\.env\.backend$|^\.env\.production$|^\.env\.staging$'; then
            echo "Secret env file tracked by git — remove it"
            exit 1
          fi
          echo "No secret env files in git index"
