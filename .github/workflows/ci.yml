name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  # Permanent clinic regression gates — must stay green to prevent known prod bugs returning.
  clinic-regression-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Historical clinic bug regression suite
        run: |
          python -m pytest -q \
            tests/test_reception_patient_number_generation.py \
            tests/test_reception_register_idempotency.py \
            tests/test_reception_emergency_specialty_invoice.py \
            tests/test_reception_his_duplicate_registration.py \
            tests/test_billing_integrity_hardening.py \
            tests/test_pr31_adversarial_audit.py \
            tests/test_auth_spa_cross_origin_tokens.py \
            tests/test_auth_same_origin_cookies.py \
            tests/test_ws_auth_security.py \
            tests/test_mobile_money_webhook_security.py \
            tests/test_tenant_mutation_hardening.py \
            tests/test_patient_number_migration.py \
            tests/test_schema_startup_authority.py \
            tests/test_reception_service_request_billing.py \
            tests/test_unified_billing.py \
            tests/test_invoice_serial_allocation.py \
            tests/test_payment_access_enforcement.py \
            tests/test_payment_settlement_security.py \
            tests/test_clinic_isolation_security.py \
            tests/test_patient_record_security.py \
            tests/test_redteam_round2_clinical_idor.py \
            tests/test_redteam_final_assessment.py \
            tests/test_security_wave0_identity.py \
            tests/test_security_wave1_api.py \
            tests/test_security_wave6_pentest.py \
            tests/test_registration_security.py \
            tests/test_simple_pdf_unicode.py \
            tests/test_visit_workflow_auth.py \
            tests/test_nutrition_immunization_auth.py \
            tests/test_hospitalization.py \
            tests/test_doctor_appointment_rbac.py \
            tests/test_appointments_rendezvous_parity.py \
            tests/test_clinic_pilot_seed_passwords.py \
            tests/test_attachment_security.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-sante/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (apiError + reception duplicate regression locks)
        run: npm run test:unit
      - name: Offline pure/unit tests
        run: npm run test:offline
      - name: Audit production dependencies (block high/critical advisories)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          VITE_API_URL: https://example.com/api
          VITE_TELECONSULT_PROVIDER: stub

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-sante/frontend/package-lock.json
      - run: npm ci
        working-directory: frontend-sante/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend-sante/frontend
      - run: npm run test:e2e
        working-directory: frontend-sante/frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend-sante/frontend/playwright-report/
          retention-days: 7

  secrets-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed secrets
        run: |
          set -e
          if git ls-files | grep -E '^\.env$|^deploy/env/\.env\.backend$|^\.env\.production$|^\.env\.staging$'; then
            echo "Secret env file tracked by git — remove it"
            exit 1
          fi
          echo "No secret env files in git index"
