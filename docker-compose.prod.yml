# Production overlay — use with VPS + Let's Encrypt
# docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d
#
# Security Wave 3: production flags, TLS nginx ports, no host-published Postgres.

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}

  backend:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      ENABLE_LAN_DEV: "false"
      ENABLE_DEMO_CLINIC_SEED: "false"
      ENABLE_STARTUP_TEST_USER: "false"
      ENABLE_STARTUP_SEED: "false"
      ENABLE_PILOT_SEED: ${ENABLE_PILOT_SEED:-false}
      BYPASS_AVAILABILITY_VALIDATION: "false"
      TRUSTED_PROXY_HOSTS: ${TRUSTED_PROXY_HOSTS:-127.0.0.1,backend}
      REMINDER_RESPOND_TOKEN: ${REMINDER_RESPOND_TOKEN:?REMINDER_RESPOND_TOKEN must be set in .env.production}
      ATTACHMENT_ENCRYPTION_KEY: ${ATTACHMENT_ENCRYPTION_KEY:?ATTACHMENT_ENCRYPTION_KEY must be set in .env.production}
      # Compose-internal Postgres has no TLS — do not force Railway sslmode.
      DB_SSLMODE: ${DB_SSLMODE:-}
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    security_opt:
      - no-new-privileges:true
