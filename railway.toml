# Railway — FastAPI backend (Dockerfile) + linked PostgreSQL
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Always migrate before serving — do not start bare uvicorn.
startCommand = "/bin/sh /app/scripts/docker/entrypoint-backend.sh /bin/sh /app/scripts/docker/start-uvicorn.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
