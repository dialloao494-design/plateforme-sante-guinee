# Railway — FastAPI backend (Dockerfile) + linked PostgreSQL
# Docs: https://docs.railway.app/reference/config-as-code
#
# IMPORTANT: Do not set startCommand here. Railway's Dockerfile ENTRYPOINT/CMD
# already run scripts/docker/entrypoint-backend.sh → start-uvicorn.sh.
# A startCommand override (added in 40b4aa6) caused every subsequent GitHub
# auto-deploy to fail (sunny-illumination - web → "Deployment failed").

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
